name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grid_core
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" maturin
      - name: Build Rust kernel (grid_core)
        run: |
          cd grid_core
          maturin build --release --out dist
          pip install --force-reinstall dist/*.whl
      - name: Lint
        run: ruff check grid tests
      - name: Tests (gates G0-G4 slice + mini-G5/G6/G10a, shipped defaults)
        run: pytest tests/ -q
      - name: Tests (legacy kill-switch leg — pre-0.3.0 flag-off configuration)
        run: >
          GRID_PERF_FACTORED_SCANNER=0 GRID_PERF_LALR_DP=0 GRID_PERF_HASHCONS=0
          GRID_PERF_DIRECT_EMIT=0
          pytest tests/ -q
      - name: Tests (direct-emit render+reload oracle, P2)
        # every from_parts also renders the manifest and spec.load()s it,
        # asserting full grammar identity (AssertionError on any renderer/
        # object-builder drift) — the permanent live oracle
        run: >
          GRID_PERF_DIRECT_EMIT_CHECK=1
          pytest tests/grammar tests/jsonschema_bridge -q
      - name: Tests (factored lazy regime, pure-spec walk)
        # budget 0 forces every scanner onto the LazyProductDFA facade; crossed
        # with GRID_NO_RUST so kernel-only suites skip instead of asserting v7
        run: >
          GRID_PERF_FACTORED_BUDGET=0 GRID_NO_RUST=1
          pytest tests/lexer tests/mask tests/trie tests/guide tests/generate tests/jsonschema_bridge -q
      - name: Tests (component-lazy regime, P3)
        # component budget 1 forces every non-degenerate terminal onto the
        # demand-interned LazyTerminalDFA (env "0" is the kill switch, so 1 is
        # the smallest all-lazy value); product budget 0 stacks the facades
        run: >
          GRID_PERF_COMPONENT_BUDGET=1 GRID_PERF_FACTORED_BUDGET=0 GRID_NO_RUST=1
          pytest tests/lexer tests/mask tests/trie tests/guide tests/generate tests/jsonschema_bridge -q
